services:
  arma3-main:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_NAME: main
        UID: ${HOST_UID}
        GID: ${HOST_GID}
    image: arma3-base:latest
    container_name: arma3-main
    network_mode: host
    volumes:
      - /home/arma3server/missions:/home/arma3server/serverfiles/mpmissions
      - /home/arma3server/mods:/home/arma3server/.local/share/Steam/steamapps/workshop/content/107410
    restart: unless-stopped
    secrets:
      - steam_user_password
      - steam_user
      - steam_password
secrets:
  steam_user_password:
    file: ./secrets/secrets-common
  steam_user:
    file: ./secrets/steam_user
  steam_password:
    file: ./secrets/steam_password