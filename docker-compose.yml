services:
  arma3-base:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_NAME: base
        UID: ${HOST_UID}
        GID: ${HOST_GID}
    image: arma3-base:latest
    container_name: arma3-base
    network_mode: host
    volumes:
      - /home/arma3server/missions:/home/arma3server/serverfiles/mpmissions
      - /home/arma3server/mods:/home/arma3server/.local/share/Steam/steamapps/workshop/content/107410
    restart: unless-stopped
    stop_grace_period: 60s
    secrets:
      - steam_user_password
      - steam_user
      - steam_password

  arma3-experimental:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_NAME: experimental
        UID: ${HOST_UID}
        GID: ${HOST_GID}
        MODPACK_PATH: "Main/GTO_Main_37_Base.html"
    image: arma3-experimental:latest
    container_name: arma3-experimental
    network_mode: host
    volumes:
      - /home/arma3server/missions:/home/arma3server/serverfiles/mpmissions
      - /home/arma3server/mods:/home/arma3server/.local/share/Steam/steamapps/workshop/content/107410
    restart: unless-stopped
    stop_grace_period: 60s
    secrets:
      - steam_user_password
      - steam_user
      - steam_password

  arma3-main:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_NAME: main
        UID: ${HOST_UID}
        GID: ${HOST_GID}
        MODPACK_PATH: "Main/GTO_Main_37_Base.html"
    image: arma3-main:latest
    container_name: arma3-main
    network_mode: host
    volumes:
      - /home/arma3server/missions:/home/arma3server/serverfiles/mpmissions
      - /home/arma3server/mods:/home/arma3server/.local/share/Steam/steamapps/workshop/content/107410
    restart: unless-stopped
    stop_grace_period: 60s
    secrets:
      - steam_user_password
      - steam_user
      - steam_password

  arma3-spider:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_NAME: spider
        UID: ${HOST_UID}
        GID: ${HOST_GID}
        MODPACK_PATH: "Spider/GTO_PineSpider_3_Base.html"
    image: arma3-spider:latest
    container_name: arma3-spider
    network_mode: host
    volumes:
      - /home/arma3server/missions:/home/arma3server/serverfiles/mpmissions
      - /home/arma3server/mods:/home/arma3server/.local/share/Steam/steamapps/workshop/content/107410
    restart: unless-stopped
    stop_grace_period: 60s
    secrets:
      - steam_user_password
      - steam_user
      - steam_password

  arma3-custom:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_NAME: custom
        UID: ${HOST_UID}
        GID: ${HOST_GID}
        MODPACK_PATH: "GreenBerets/GTO_GreenBerets_01_Base.html"
    image: arma3-custom:latest
    container_name: arma3-custom
    network_mode: host
    volumes:
      - /home/arma3server/missions:/home/arma3server/serverfiles/mpmissions
      - /home/arma3server/mods:/home/arma3server/.local/share/Steam/steamapps/workshop/content/107410
    restart: unless-stopped
    stop_grace_period: 60s
    secrets:
      - steam_user_password
      - steam_user
      - steam_password

secrets:
  steam_user_password:
    file: ./secrets/secrets-common
  steam_user:
    file: ./secrets/steam_user
  steam_password:
    file: ./secrets/steam_password
